<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мир Лили 🌸</title>
<meta name="theme-color" content="#ff8ab7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мир Лили">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Nunito","Segoe UI",-apple-system,BlinkMacSystemFont,"Arial Rounded MT Bold",sans-serif;
  background:#ffeaf3;display:flex;flex-direction:column;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  position:fixed;top:0;left:0;right:0;width:100%;
}
/* ---------- TOP BAR ---------- */
#topbar{
  flex:0 0 auto;min-height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;
  padding:env(safe-area-inset-top,0px) 12px 0;background:linear-gradient(180deg,#ff9ec4,#ff8ab7);
  box-shadow:0 3px 0 #e5749b;z-index:50;position:relative;
}
#topbar .title{font-weight:800;font-size:19px;color:#fff;text-shadow:0 2px 0 #e0669c;letter-spacing:.5px}
#topbar .right{display:flex;align-items:center;gap:8px}
#starbox{
  background:#fff;border-radius:20px;padding:4px 12px;font-weight:800;color:#e8862c;
  font-size:16px;box-shadow:0 2px 0 #e5749b;transition:transform .2s;
}
#starbox.bump{transform:scale(1.25)}
#sndbtn{
  width:38px;height:38px;border:none;border-radius:50%;background:#fff;font-size:18px;
  box-shadow:0 2px 0 #e5749b;cursor:pointer;
}
/* ---------- STAGE ---------- */
#stage{flex:1 1 auto;position:relative;overflow:hidden;background:#fff5fa}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.active{display:block}
.wall{position:absolute;left:0;right:0;top:0;bottom:26%}
.floor{position:absolute;left:0;right:0;bottom:0;height:26%}
/* home */
#sc-home .wall{
  background:#ffeaf3;
  background-image:radial-gradient(circle at 12px 12px,#ffd2e6 7px,transparent 8px);
  background-size:64px 64px;
}
#sc-home .floor{
  background:repeating-linear-gradient(90deg,#f0cda2 0 68px,#e6bf91 68px 72px);
  box-shadow:inset 0 6px 0 rgba(214,166,110,.55);
}
/* cafe */
#sc-cafe .wall{background:#fff6e8;background-image:radial-gradient(circle at 14px 14px,#ffe6c4 6px,transparent 7px);background-size:70px 70px}
#sc-cafe .floor{
  height:22%;
  background-color:#fff3e2;
  background-image:
    linear-gradient(45deg,#ffd9b8 25%,transparent 25%,transparent 75%,#ffd9b8 75%),
    linear-gradient(45deg,#ffd9b8 25%,transparent 25%,transparent 75%,#ffd9b8 75%);
  background-size:52px 52px;background-position:0 0,26px 26px;
}
/* park */
#sc-park .wall{bottom:30%;background:linear-gradient(180deg,#a5dcff 0%,#d8f2ff 80%,#e9f9ef 100%)}
#sc-park .floor{height:30%;background:linear-gradient(180deg,#93d873 0%,#7cc95e 60%,#6bbc50 100%);box-shadow:inset 0 6px 0 rgba(120,190,90,.6)}
/* wardrobe */
#sc-fit{background:linear-gradient(180deg,#ffe4f0 0%,#f6e6ff 100%);display:none;flex-direction:column}
#sc-fit.active{display:flex}

.deco{position:absolute;pointer-events:none}
.deco.tappable{pointer-events:auto;cursor:pointer;border:none;background:none}

/* generic emoji object buttons */
.obj{
  position:absolute;border:none;background:none;cursor:pointer;line-height:1;
  filter:drop-shadow(0 4px 3px rgba(150,90,120,.25));z-index:6;padding:4px;
}
.obj:active{transform:scale(.9)}
.obj.boing{animation:boing .5s}
@keyframes boing{
  0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-6deg)}
  60%{transform:scale(.92) rotate(5deg)}100%{transform:scale(1)}
}
/* sun & clouds */
#sun{position:absolute;top:5%;left:6%;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle,#ffe990 55%,#ffd44d 100%);
  box-shadow:0 0 46px 18px rgba(255,224,120,.75);animation:sunpulse 4s ease-in-out infinite}
@keyframes sunpulse{50%{box-shadow:0 0 60px 26px rgba(255,224,120,.9)}}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.95}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:96px;height:30px;top:9%;left:110%;animation:drift 42s linear infinite}
.cloud.c1::before{width:42px;height:42px;top:-20px;left:14px}
.cloud.c1::after{width:30px;height:30px;top:-14px;left:52px}
.cloud.c2{width:70px;height:24px;top:20%;left:110%;animation:drift 58s linear infinite -20s}
.cloud.c2::before{width:32px;height:32px;top:-16px;left:10px}
.cloud.c2::after{width:24px;height:24px;top:-10px;left:38px}
.cloud.c3{width:110px;height:32px;top:36%;left:110%;animation:drift 72s linear infinite -40s}
.cloud.c3::before{width:46px;height:46px;top:-22px;left:16px}
.cloud.c3::after{width:34px;height:34px;top:-16px;left:58px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-160vw)}}
/* butterfly */
#butterfly{position:absolute;font-size:30px;z-index:7;animation:flutter 14s ease-in-out infinite;border:none;background:none;cursor:pointer}
@keyframes flutter{
  0%{left:8%;top:30%}20%{left:35%;top:16%}40%{left:60%;top:34%}
  60%{left:42%;top:48%}80%{left:16%;top:40%}100%{left:8%;top:30%}
}
/* pond */
#pond{position:absolute;right:6%;bottom:4%;width:34%;height:14%;border-radius:50%;
  background:radial-gradient(ellipse,#9fd9f7 60%,#7bc3ec 100%);box-shadow:inset 0 4px 8px rgba(80,140,190,.4)}
/* swing animation */
.swingG{transform-box:view-box;transform-origin:244px 118px}
.swingG.go{animation:swinging 1.1s ease-in-out 3}
@keyframes swinging{0%,100%{transform:rotate(0)}25%{transform:rotate(13deg)}75%{transform:rotate(-13deg)}}
/* night overlay */
#night{position:absolute;inset:0;background:#25317c;opacity:0;pointer-events:none;transition:opacity .7s;z-index:8;mix-blend-mode:multiply}
#sc-home.night #night{opacity:.62}
#lampglow{position:absolute;width:220px;height:220px;border-radius:50%;z-index:9;pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,150,.55) 0%,rgba(255,236,150,0) 70%);opacity:0;transition:opacity .7s}
#sc-home.night #lampglow{opacity:1}
/* counter (cafe) */
#counter{position:absolute;left:3%;right:30%;bottom:13%;height:26%;z-index:5}
#counter .front{position:absolute;inset:0;border-radius:0 0 20px 20px;z-index:2;
  background:linear-gradient(180deg,#ff9ec4,#f386b1);box-shadow:0 5px 0 #d96f9c, inset 0 -10px 0 rgba(0,0,0,.05)}
#counter .ctop{position:absolute;left:-3%;right:-3%;top:-12px;height:22px;background:#fff;border-radius:12px;box-shadow:0 4px 0 #edc7db;z-index:2}
#counter .case{position:absolute;left:5%;right:5%;top:10%;bottom:18%;background:#fff8fb;border-radius:14px;
  box-shadow:inset 0 3px 8px rgba(190,120,150,.28);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-evenly;padding:4px}
#counter .case .obj{position:relative}
#counter .heartrow{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-size:14px;color:#fff;opacity:.9;letter-spacing:10px}
#menuboard{position:absolute;right:4%;top:9%;width:26%;min-width:120px;background:#7c5b45;border-radius:14px;padding:10px 6px;
  text-align:center;color:#fff8ea;box-shadow:0 4px 0 #644836;z-index:4}
#menuboard .mtitle{font-weight:800;font-size:15px;letter-spacing:2px}
#menuboard .mrow{font-size:19px;margin-top:5px}
/* rug */
#rug{position:absolute;left:52%;bottom:5%;width:40%;height:11%;border-radius:50%;z-index:2;
  background:radial-gradient(ellipse,#ffd2e6 0 38%,#ffb7d5 39% 68%,#ff9ec4 69% 100%)}
/* sprite */
#sprite{position:absolute;width:96px;z-index:10;bottom:var(--sb,7%);will-change:left}
#sprite .flip{transition:transform .15s}
#sprite.left .flip{transform:scaleX(-1)}
#sprite svg{width:100%;display:block}
#sprite.walking .flip{animation:walkbob .32s ease-in-out infinite}
@keyframes walkbob{0%,100%{transform:translateY(0) scaleX(var(--fx,1)) rotate(0)}50%{transform:translateY(-7px) scaleX(var(--fx,1)) rotate(2deg)}}
#sprite.jump .flip{animation:jump .55s ease}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-34px)}}
#sprite.sleeping{z-index:9}
#sprite.sleeping .flip{transform:rotate(-90deg);animation:none;transition:transform .5s}
#blanket{position:absolute;display:none;z-index:11;border-radius:16px;pointer-events:none;
  background:linear-gradient(180deg,#b48ae0,#9f74cf);border:3px solid #9a6cc9;box-shadow:0 4px 0 #8a5cb9}
#blanket::after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ffd2e8;font-size:20px}
/* speech bubble */
#bubble{
  position:absolute;bottom:103%;left:50%;transform:translateX(-50%) scale(0);transform-origin:bottom center;
  background:#fff;border-radius:14px;padding:7px 12px;font-weight:800;font-size:15px;color:#b0498a;
  white-space:nowrap;box-shadow:0 3px 0 rgba(210,140,175,.5);transition:transform .22s;z-index:20;
}
#bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
#bubble.show{transform:translateX(-50%) scale(1)}
/* floating mini-bubble at objects */
.minisay{position:absolute;background:#fff;border-radius:12px;padding:5px 10px;font-weight:800;font-size:14px;color:#8a55b0;
  box-shadow:0 3px 0 rgba(190,150,210,.4);z-index:30;animation:minisay 1.4s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes minisay{0%{transform:scale(0)}18%{transform:scale(1.1)}28%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
/* particles */
.pt{position:absolute;z-index:40;pointer-events:none;animation:fly .9s ease-out forwards;font-size:20px}
@keyframes fly{
  0%{transform:translate(0,0) scale(.6);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.25);opacity:0}
}
.starfly{position:fixed;z-index:100;font-size:26px;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}
/* hint */
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#c05a92;
  font-weight:800;font-size:14px;padding:7px 14px;border-radius:20px;z-index:45;box-shadow:0 3px 0 rgba(220,150,185,.4);
  animation:hintfade 4s ease forwards;pointer-events:none;max-width:92%;text-align:center}
@keyframes hintfade{0%{opacity:0;transform:translate(-50%,-10px)}10%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* ---------- WARDROBE ---------- */
#fitTop{flex:0 0 46%;display:flex;align-items:center;justify-content:center;position:relative}
#fitChar{height:92%;filter:drop-shadow(0 8px 6px rgba(190,120,160,.3))}
#fitChar svg{height:100%;display:block}
#fitName{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-weight:800;color:#d867a3;font-size:18px;
  background:#fff;padding:4px 16px;border-radius:20px;box-shadow:0 3px 0 rgba(220,150,185,.4)}
#podium{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);width:190px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse,#f3c7e2 0%,#eab3d6 100%)}
#fitPanel{flex:1 1 auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 0 #f0c6de;
  display:flex;flex-direction:column;overflow:hidden}
#fitTabs{display:flex;gap:6px;padding:10px 10px 4px}
.tab{flex:1;border:none;border-radius:14px;padding:8px 2px;font-size:13px;font-weight:800;color:#b784a8;
  background:#f9edf5;cursor:pointer;font-family:inherit}
.tab .ticon{display:block;font-size:20px;margin-bottom:2px}
.tab.sel{background:linear-gradient(180deg,#ff9ec4,#ff86b5);color:#fff;box-shadow:0 3px 0 #e5749b}
#fitBody{flex:1;overflow-y:auto;padding:8px 12px 16px}
.rowlabel{font-size:12px;font-weight:800;color:#c99cb8;margin:8px 0 5px;letter-spacing:1px}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:3px solid #f3dcea;border-radius:14px;background:#fff;padding:8px 12px;font-weight:800;font-size:14px;
  color:#a6699a;cursor:pointer;font-family:inherit}
.opt .oicon{margin-right:4px}
.opt.sel{border-color:#ff86b5;background:#ffeef6;color:#e0568f}
.opt.locked{opacity:.55}
.dot{width:38px;height:38px;border-radius:50%;border:4px solid #f0e2ec;cursor:pointer}
.dot.sel{border-color:#ff86b5;box-shadow:0 0 0 3px #ffd7e8}
/* ---------- NAV ---------- */
#nav{flex:0 0 68px;display:flex;background:#fff;box-shadow:0 -3px 0 #f3d7e6;z-index:50;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
.navb{flex:1;border:none;border-radius:16px;background:#fdf3f8;cursor:pointer;font-family:inherit;
  font-weight:800;color:#bb87ab;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.navb .nicon{font-size:24px;line-height:1}
.navb.sel{background:linear-gradient(180deg,#ff9ec4,#ff86b5);color:#fff;box-shadow:0 3px 0 #e5749b}
/* ---------- RESPONSIVE ---------- */
@media (max-width:374px){
  #topbar .title{font-size:16px}
  #starbox{font-size:14px;padding:3px 9px}
  #sndbtn{width:32px;height:32px;font-size:15px}
  #nav{flex:0 0 62px}
  .navb{font-size:11px}
  .navb .nicon{font-size:21px}
  .tab{font-size:12px}
  .opt{padding:7px 9px;font-size:13px}
  .dot{width:34px;height:34px}
  #sprite{width:84px}
}
@media (min-width:640px){
  #sprite{width:132px}
  #butterfly{font-size:42px}
  #nav{flex:0 0 76px}
  .navb{font-size:14px}
  .navb .nicon{font-size:28px}
  #bubble{font-size:17px}
}
#rotate{position:fixed;inset:0;background:linear-gradient(180deg,#ff9ec4,#c8a2e8);z-index:500;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-weight:800;
  font-size:20px;text-align:center;padding:24px}
#rotate .ph{font-size:64px;animation:rotph 1.8s ease-in-out infinite}
@keyframes rotph{0%,15%{transform:rotate(-90deg)}55%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:540px){ #rotate{display:flex} }
/* ---------- POPUP ---------- */
#popup{position:fixed;inset:0;background:rgba(120,60,110,.45);z-index:200;display:none;align-items:center;justify-content:center}
#popup.show{display:flex}
#popcard{background:#fff;border-radius:26px;padding:28px 30px;text-align:center;max-width:82%;
  box-shadow:0 8px 0 #e5a8c8;animation:popin .4s cubic-bezier(.2,1.6,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#popcard .big{font-size:56px}
#popcard h2{color:#d8569a;margin:8px 0 4px;font-size:21px}
#popcard p{color:#b18aa5;font-weight:700;font-size:15px}
#popcard button{margin-top:16px;border:none;background:linear-gradient(180deg,#ff9ec4,#ff86b5);color:#fff;
  font-weight:800;font-size:16px;padding:11px 30px;border-radius:20px;box-shadow:0 4px 0 #e5749b;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="topbar">
  <div class="title">🌸 Мир Лили</div>
  <div class="right">
    <div id="starbox">⭐ <span id="starN">0</span>/10</div>
    <button id="sndbtn">🔊</button>
  </div>
</div>

<div id="stage">

  <!-- ================= HOME ================= -->
  <div class="scene active" id="sc-home" style="--sb:7%">
    <div class="wall"></div>
    <div class="floor"></div>
    <svg class="deco" style="left:0;top:0;width:100%;height:48px" viewBox="0 0 600 52" preserveAspectRatio="none">
      <path d="M0,6 Q150,30 300,12 Q450,30 600,6" stroke="#e8b6cc" stroke-width="4" fill="none"/>

    </svg>
    <button class="deco tappable obj" data-id="h-window" style="left:4%;top:8%;width:44%;max-width:300px">
      <svg viewBox="0 0 240 200" width="100%">
        <rect x="6" y="6" width="228" height="188" rx="20" fill="#fff" stroke="#f3cfe4" stroke-width="7"/>

    </button>
    <button class="deco tappable obj" data-id="h-pic" style="left:53%;top:11%;width:17%;max-width:120px">
      <svg viewBox="0 0 120 130" width="100%">
        <rect x="4" y="4" width="112" height="122" rx="14" fill="#fff" stroke="#f3cfe4" stroke-width="7"/>
        <rect x="18" y="18" width="84" height="94" rx="8" fill="#ffeef6"/>
        <path d="M60,52 c-10,-16 -34,-6 -27,12 c5,13 27,24 27,24 c0,0 22,-11 27,-24 c7,-18 -17,-28 -27,-12 Z" fill="#ff86b5"/>
      </svg>
    </button>
    <div class="deco" style="left:74%;top:17%;width:14%;max-width:100px">
      <svg viewBox="0 0 100 110" width="100%">
        <rect x="4" y="4" width="92" height="102" rx="12" fill="#fff" stroke="#f3cfe4" stroke-width="6"/>
        <rect x="15" y="15" width="70" height="80" rx="7" fill="#fff8dd"/>
        <path d="M50,28 L57,46 L76,47 L61,59 L66,78 L50,67 L34,78 L39,59 L24,47 L43,46 Z" fill="#ffd44d"/>

    </div>
    <svg class="deco" viewBox="0 0 200 60" style="right:12%;bottom:36%;width:26%;max-width:170px">
      <rect x="0" y="8" width="200" height="18" rx="9" fill="#e8a8c4"/>
      <path d="M34,26 L34,54 L62,26 Z" fill="#d894b4"/>
      <path d="M166,26 L166,54 L138,26 Z" fill="#d894b4"/>
    </svg>
    <button class="deco tappable obj" data-id="h-bed" style="left:2%;bottom:16%;width:56%;max-width:400px">
      <svg viewBox="0 0 320 210" width="100%">
        <rect x="8" y="8" width="46" height="162" rx="15" fill="#e79fc0" stroke="#d07ba6" stroke-width="5"/>
        <rect x="26" y="100" width="286" height="66" rx="18" fill="#fdf7ff" stroke="#e4d7f0" stroke-width="5"/>
        <ellipse cx="74" cy="94" rx="37" ry="21" fill="#fff" stroke="#ead9f5" stroke-width="4"/>
        <path d="M122,88 H296 Q312,88 312,106 V148 Q312,166 294,166 H122 Q136,140 122,127 Q136,114 122,88 Z" fill="#b48ae0" stroke="#9a6cc9" stroke-width="5"/>
        <path d="M206,118 c-5,-9 -18,-4 -14,6 c3,7 14,12 14,12 c0,0 11,-5 14,-12 c4,-10 -9,-15 -14,-6 Z" fill="#ffd2e8"/>
        <rect x="34" y="166" width="15" height="28" rx="6" fill="#caa2e2"/>
        <rect x="292" y="166" width="15" height="28" rx="6" fill="#caa2e2"/>
      </svg>

    <path d="M${ox-1.5*dir},88.5 Q${ox+2*dir},84 ${ox+4.5*dir},82.5" stroke="#3a2a1e" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  };
  const head=`<rect x="101" y="130" width="18" height="22" rx="7" fill="${sk}"/>
    <ellipse cx="110" cy="95" rx="57" ry="53" fill="${sk}"/>
    ${eye(88,-1)}${eye(132,1)}
    <ellipse cx="68" cy="118" rx="8" ry="4.5" fill="#ffa8bd" opacity=".65"/>
    <ellipse cx="152" cy="118" rx="8" ry="4.5" fill="#ffa8bd" opacity=".65"/>
    <path d="M101,123 Q110,132 119,123" stroke="#d15b6e" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="iris-${uid}" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#bda45c"/><stop offset="55%" stop-color="#7d8348"/><stop offset="100%" stop-color="#50592e"/>
    </radialGradient></defs>
    ${hairBack}${hairExtra}${legs}${shoesSvg}${dressSvg}${arms}${head}${bangs}${hairFront}${accSvg}</svg>`;
}
function renderChar(){
  document.querySelector("#sprite .flip").innerHTML=charSVG("s");
  document.getElementById("fitChar").innerHTML=charSVG("f");
}

/* ============ SOUND ============ */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f1,dur,opts={}){
  if(!st.sound)return; const a=ac(); if(!a)return;
  const {f2=f1,type="sine",vol=.14,delay=0}=opts;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.connect(g);g.connect(a.destination);
  const t=a.currentTime+delay;
  o.frequency.setValueAtTime(f1,t);
  if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t);o.stop(t+dur+.05);
}
const S={
  pop(){tone(520,.12);tone(880,.1,{delay:.06});},
  meow(){tone(760,.28,{f2:420,type:"triangle",vol:.12});},
  bark(){tone(220,.1,{type:"square",vol:.08});tone(180,.12,{type:"square",vol:.08,delay:.12});},
  quack(){tone(320,.12,{f2:260,type:"sawtooth",vol:.06});tone(320,.12,{f2:260,type:"sawtooth",vol:.06,delay:.15});},
  chirp(){tone(1400,.09,{f2:1900});tone(1600,.09,{f2:2100,delay:.12});},
  yum(){tone(440,.1);tone(550,.1,{delay:.09});tone(660,.14,{delay:.18});},
  star(){tone(660,.12);tone(880,.12,{delay:.09});tone(1180,.2,{delay:.18});},
  whee(){tone(400,.5,{f2:900,type:"triangle",vol:.1});},
  night(){tone(500,.3,{f2:250,type:"sine",vol:.1});},
  melody(){[523,587,659,784,659,880,784].forEach((n,i)=>tone(n,.16,{delay:i*.17,type:"triangle",vol:.11}));},
  lullaby(){[659,587,523].forEach((n,i)=>tone(n,.5,{delay:i*.55,type:"triangle",vol:.09}));},
  fanfare(){[523,659,784,1047].forEach((n,i)=>tone(n,.25,{delay:i*.13,type:"triangle",vol:.14}));}
};
document.getElementById("sndbtn").addEventListener("click",e=>{
  st.sound=!st.sound; e.target.textContent=st.sound?"🔊":"🔇"; if(st.sound)S.pop();
});

/* ============ HELPERS ============ */
const stage=document.getElementById("stage");
const sprite=document.getElementById("sprite");
function burst(x,y,emojis,n=7){
  for(let i=0;i<n;i++){
    const p=document.createElement("span");
    p.className="pt";p.textContent=emojis[i%emojis.length];
    const ang=Math.random()*Math.PI*2,r=40+Math.random()*55;
    p.style.setProperty("--dx",Math.cos(ang)*r+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*r-30)+"px");
    p.style.left=x+"px";p.style.top=y+"px";
    stage.appendChild(p);setTimeout(()=>p.remove(),950);
  }
}
function burstAt(el,emojis,n){
  const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  burst(r.left-s.left+r.width/2,r.top-s.top+r.height/2,emojis,n);
}
function say(text,ms=1600){
  const b=document.getElementById("bubble");
  b.textContent=text;b.classList.add("show");
  clearTimeout(say._t);say._t=setTimeout(()=>b.classList.remove("show"),ms);
}
function miniSay(el,text){
  const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  const m=document.createElement("div");m.className="minisay";m.textContent=text;
  m.style.left=(r.left-s.left+r.width/2-30)+"px";
  m.style.top=(r.top-s.top-30)+"px";
  stage.appendChild(m);setTimeout(()=>m.remove(),1450);
}
function boing(el){el.classList.remove("boing");void el.offsetWidth;el.classList.add("boing");}
function flyToLily(el,emoji,phrase){
  const r=el.getBoundingClientRect(),sp=sprite.getBoundingClientRect();
  const f=document.createElement("span");f.className="starfly";f.textContent=emoji;
  f.style.left=r.left+r.width/2+"px";f.style.top=r.top+"px";
  document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    f.style.left=(sp.left+sp.width/2)+"px";f.style.top=(sp.top+10)+"px";
    f.style.transform="scale(.5)";f.style.opacity="0";
  }));
  setTimeout(()=>{f.remove();say(phrase);S.yum();
    const s=stage.getBoundingClientRect(),sp2=sprite.getBoundingClientRect();
    burst(sp2.left-s.left+sp2.width/2,sp2.top-s.top+30,["❤️","✨"],6);
  },820);
}

/* ============ STARS ============ */
function giveStar(id,el){
  if(stars.has(id))return; stars.add(id);
  const box=document.getElementById("starbox");
  const r=el.getBoundingClientRect();
  const f=document.createElement("span");f.className="starfly";f.textContent="⭐";
  f.style.left=r.left+r.width/2+"px";f.style.top=r.top+"px";
  document.body.appendChild(f);
  const b=box.getBoundingClientRect();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    f.style.left=b.left+b.width/2+"px";f.style.top=b.top+"px";f.style.transform="scale(.6)";
  }));
  setTimeout(()=>{
    f.remove();
    document.getElementById("starN").textContent=Math.min(stars.size,10);
    box.classList.add("bump");setTimeout(()=>box.classList.remove("bump"),220);
    S.star();
    if(stars.size>=10&&!st.crown){st.crown=true;unlockCrown();}
  },830);
}
function unlockCrown(){
  S.fanfare();
  document.getElementById("popup").classList.add("show");
  const s=stage.getBoundingClientRect();
  for(let i=0;i<3;i++)setTimeout(()=>burst(s.width*Math.random(),s.height*.3*Math.random()+40,["🎉","✨","⭐","🎊"],8),i*260);
  buildFitBody();
}
document.getElementById("popok").addEventListener("click",()=>{
  document.getElementById("popup").classList.remove("show");
});

/* ============ SCENES & NAV ============ */
let curScene=document.getElementById("sc-home");
function showScene(id){
  if(typeof wake==="function")wake(false);
  document.querySelectorAll(".scene").forEach(s=>s.classList.remove("active"));
  curScene=document.getElementById(id);
  curScene.classList.add("active");
  document.querySelectorAll(".navb").forEach(b=>b.classList.toggle("sel",b.dataset.scene===id));
  if(id!=="sc-fit"){
    curScene.appendChild(sprite);sprite.style.display="block";
    sprite.classList.remove("walking");
    sprite.style.transition="none";
    sprite.style.left=(curScene.clientWidth*.42)+"px";
    if(!hinted.has(id)){
      hinted.add(id);
      const h=document.createElement("div");h.className="hint";
      h.textContent=id==="sc-home"?"Нажимай на предметы — они оживают! ✨":"Нажимай на всё вокруг! ✨";
      curScene.appendChild(h);setTimeout(()=>h.remove(),4100);
    }
  }else{
    sprite.style.display="none";
    renderChar();
  }
  S.pop();
}
document.querySelectorAll(".navb").forEach(b=>b.addEventListener("click",()=>showScene(b.dataset.scene)));

/* ============ WALKING ============ */
document.querySelectorAll(".scene").forEach(sc=>{
  if(sc.id==="sc-fit")return;
  sc.addEventListener("click",e=>{
    if(e.target.closest(".obj")||e.target.closest("#butterfly"))return;
    if(st.sleep){wake(true);return;}
    const rect=sc.getBoundingClientRect();
    let x=e.clientX-rect.left-sprite.offsetWidth/2;
    x=Math.max(4,Math.min(rect.width-sprite.offsetWidth-4,x));
    const cur=parseFloat(sprite.style.left)||0;
    const dist=Math.abs(x-cur); if(dist<8)return;
    sprite.classList.toggle("left",x<cur);
    sprite.style.setProperty("--fx",x<cur?-1:1);
    sprite.style.transition=`left ${Math.max(.35,dist/240)}s linear`;
    sprite.classList.add("walking");
    requestAnimationFrame(()=>{sprite.style.left=x+"px";});
    clearTimeout(sprite._wt);
    sprite._wt=setTimeout(()=>sprite.classList.remove("walking"),Math.max(350,dist/240*1000));
  });
});

/* ============ SLEEP ============ */
let zzT=null;
function bedInfo(){
  const bed=document.querySelector('#sc-home [data-id="h-bed"]');
  const b=bed.getBoundingClientRect(), s=document.getElementById("sc-home").getBoundingClientRect();
  return {left:b.left-s.left, width:b.width, height:b.height, bottomOff:s.bottom-b.bottom};
}
function doSleep(){
  const bi=bedInfo();
  st.sleep=true; renderChar();
  sprite.classList.remove("walking","left");
  sprite.classList.add("sleeping");
  sprite.style.transition="none";
  sprite.style.left=(bi.left+bi.width*0.42-sprite.offsetWidth/2)+"px";
  sprite.style.bottom=(bi.bottomOff+bi.height*0.30)+"px";
  const bl=document.getElementById("blanket");
  bl.style.display="block";
  bl.style.left=(bi.left+bi.width*0.42)+"px";
  bl.style.width=(bi.width*0.52)+"px";
  bl.style.height=(bi.height*0.52)+"px";
  bl.style.bottom=(bi.bottomOff+bi.height*0.30)+"px";
  document.getElementById("sc-home").classList.add("night");
  say("Спокойной ночи... 💤",2200);
  S.lullaby();
  zzT=setInterval(()=>{
    if(!st.sleep)return;
    const r=sprite.getBoundingClientRect(), s=stage.getBoundingClientRect();
    burst(r.left-s.left+r.width*0.3, r.top-s.top+4, ["💤"],1);
  },1600);
}
function wake(morning){
  if(!st.sleep)return;
  st.sleep=false; renderChar();
  sprite.classList.remove("sleeping");
  sprite.style.bottom="";
  document.getElementById("blanket").style.display="none";
  document.getElementById("sc-home").classList.remove("night");
  if(zzT){clearInterval(zzT);zzT=null;}
  if(morning){say("Доброе утро! ☀️");S.chirp();}
}

/* ============ OBJECT ACTIONS ============ */
const ACTIONS={
  "h-cat":(el)=>{S.meow();miniSay(el,"Мяу! 🐾");burstAt(el,["❤️","💗"],6);},
  "h-bear":(el)=>{S.pop();miniSay(el,"Обнимашки!");burstAt(el,["❤️","🧡"],6);},
  "h-bed":(el)=>{
    if(st.sleep){wake(true);return;}
    S.night();
    const bi=bedInfo();
    const target=bi.left+bi.width*0.42-sprite.offsetWidth/2;
    const cur=parseFloat(sprite.style.left)||0;
    const dist=Math.abs(target-cur);
    if(dist>10){
      sprite.classList.toggle("left",target<cur);
      sprite.style.setProperty("--fx",target<cur?-1:1);
      sprite.style.transition=`left ${Math.max(.35,dist/240)}s linear`;
      sprite.classList.add("walking");
      requestAnimationFrame(()=>{sprite.style.left=target+"px";});
      clearTimeout(sprite._wt);
      setTimeout(doSleep,Math.max(350,dist/240*1000)+80);
    }else doSleep();
  },
  "h-window":(el)=>{S.chirp();burstAt(el,["🐦","☀️","✨"],5);},
  "h-pic":(el)=>{S.pop();burstAt(el,["💘","💗","💖"],6);},
  "h-lamp":(el)=>{
    const h=document.getElementById("sc-home");h.classList.toggle("night");
    S.night();if(h.classList.contains("night"))burstAt(el,["🌙","⭐","✨"],6);else burstAt(el,["☀️","✨"],4);
  },
  "c-bear":(el)=>{S.pop();miniSay(el,"Добро пожаловать!");burstAt(el,["💕"],4);},
  "c-cake":(el)=>flyToLily(el,"🍰","Ням-ням! 😋"),
  "c-cup":(el)=>flyToLily(el,"🧁","Как вкусно!"),
  "c-donut":(el)=>flyToLily(el,"🍩","Объедение!"),
  "c-cookie":(el)=>flyToLily(el,"🍪","Хрум-хрум!"),
  "c-juice":(el)=>flyToLily(el,"🧃","Буль-буль!"),
  "c-radio":(el)=>{S.melody();boing(el);burstAt(el,["🎵","🎶","💃"],7);},
  "p-swing":(el)=>{
    S.whee();const g=document.getElementById("swingG");
    g.classList.remove("go");void g.getBBox&&g.getBoundingClientRect();g.classList.add("go");
    setTimeout(()=>g.classList.remove("go"),3400);
    sprite.classList.remove("jump");void sprite.offsetWidth;sprite.classList.add("jump");
    say("Ви-и-и! 🎉");
  },
  "p-duck":(el)=>{S.quack();miniSay(el,"Кря-кря!");burstAt(el,["💦","💧"],6);},
  "p-dog":(el)=>{S.bark();miniSay(el,"Гав-гав!");burstAt(el,["❤️","🐾"],6);},
  "p-flower1":(el)=>{S.pop();burstAt(el,["🌸","✨","🌷"],6);},
  "p-flower2":(el)=>{S.pop();burstAt(el,["🌼","✨","🐝"],6);},
  "p-flower3":(el)=>{S.pop();burstAt(el,["🌸","💮","✨"],6);},
  "p-ice":(el)=>flyToLily(el,"🍦","Мороженое! 🍦")
};
document.querySelectorAll(".obj[data-id]").forEach(el=>{
  el.addEventListener("click",e=>{
    e.stopPropagation();
    const id=el.dataset.id;
    boing(el);
    (ACTIONS[id]||((x)=>{S.pop();burstAt(x,["✨"],5);}))(el);
    giveStar(id,el);
  });
});
document.getElementById("butterfly").addEventListener("click",e=>{
  e.stopPropagation();S.pop();burstAt(e.target,["✨","💫"],7);giveStar("p-butterfly",e.target);
});

/* ============ WARDROBE UI ============ */
const TABS=[
  {id:"hair",icon:"💇‍♀️",name:"Волосы",rows:[
    {label:"ПРИЧЁСКА",key:"hair",opts:["Длинные","Хвостики","Пучки","Каре","Кудряшки"]},
    {label:"ЦВЕТ ВОЛОС",key:"hairC",colors:HAIRC}]},
  {id:"dress",icon:"👗",name:"Наряд",rows:[
    {label:"ФАСОН",key:"dress",opts:["Платье","С рюшами","Топ и юбка"]},
    {label:"ЦВЕТ",key:"dressC",colors:DRESSC}]},
  {id:"shoes",icon:"👟",name:"Обувь",rows:[
    {label:"ОБУВЬ",key:"shoes",opts:["Кеды","Балетки","Сапожки"]}]},
  {id:"acc",icon:"🎀",name:"Разное",rows:[
    {label:"АКСЕССУАР",key:"acc",opts:["Ничего","Бантик","Ушки","Очки","Корона"]},
    {label:"ОТТЕНОК КОЖИ",key:"skin",colors:SKINS}]}
];
let curTab="hair";
const fitTabs=document.getElementById("fitTabs");
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.className="tab"+(t.id===curTab?" sel":"");
  b.innerHTML=`<span class="ticon">${t.icon}</span>${t.name}`;
  b.addEventListener("click",()=>{curTab=t.id;
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");buildFitBody();S.pop();});
  fitTabs.appendChild(b);
});
function sparkleChar(){
  const el=document.getElementById("fitChar");
  const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  burst(r.left-s.left+r.width/2,r.top-s.top+r.height/2,["✨","💖","⭐"],6);
}
function buildFitBody(){
  const tab=TABS.find(t=>t.id===curTab);
  const body=document.getElementById("fitBody");
  body.innerHTML="";
  tab.rows.forEach(row=>{
    const lab=document.createElement("div");lab.className="rowlabel";lab.textContent=row.label;
    body.appendChild(lab);
    const wrap=document.createElement("div");wrap.className="optrow";
    if(row.opts){
      row.opts.forEach((name,i)=>{
        const locked=(row.key==="acc"&&i===4&&!st.crown);
        const o=document.createElement("button");
        o.className="opt"+(st[row.key]===i?" sel":"")+(locked?" locked":"");
        o.innerHTML=locked?`🔒 ${name}`:name;
        o.addEventListener("click",()=>{
          if(locked){miniSay(o,"Собери 10 ⭐!");S.pop();return;}
          st[row.key]=i;renderChar();buildFitBody();S.pop();sparkleChar();
        });
        wrap.appendChild(o);
      });
    }else{
      row.colors.forEach((c,i)=>{
        const d=document.createElement("button");
        d.className="dot"+(st[row.key]===i?" sel":"");
        d.style.background=c[0];
        d.addEventListener("click",()=>{st[row.key]=i;renderChar();buildFitBody();S.pop();sparkleChar();});
        wrap.appendChild(d);
      });
    }
    body.appendChild(wrap);
  });
}

/* ============ INIT ============ */
/* офлайн-режим (PWA): работает только по https, локально просто пропускается */
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
/* Надёжная высота для встроенных браузеров (Telegram, VK и т.п.):
   их панели перекрывают 100vh, поэтому меряем видимую область сами */
function setVH(){
  const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  if(h)document.body.style.height=Math.round(h)+"px";
}
setVH();
window.addEventListener("resize",setVH);
window.addEventListener("orientationchange",()=>setTimeout(setVH,250));
if(window.visualViewport)window.visualViewport.addEventListener("resize",setVH);
/* запрет прокрутки-баунса внутри webview */
document.addEventListener("touchmove",e=>{
  if(!e.target.closest("#fitBody"))e.preventDefault();
},{passive:false});
if(window.innerWidth>=640){
  document.querySelectorAll(".obj").forEach(o=>{
    const fs=parseFloat(o.style.fontSize);
    if(fs)o.style.fontSize=Math.round(fs*1.35)+"px";
  });
}
renderChar();
buildFitBody();
window.addEventListener("resize",()=>{
  if(curScene&&curScene.id!=="sc-fit"){
    const w=curScene.clientWidth;
    let x=parseFloat(sprite.style.left)||0;
    sprite.style.transition="none";
    sprite.style.left=Math.min(x,w-sprite.offsetWidth-4)+"px";
  }
});
showScene("sc-home");
</script>
